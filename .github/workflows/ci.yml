name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Type-check everything first so other jobs fail fast ──────────────────────
  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # @canvas/shared publishes its types from dist/, so build it before any
      # workspace that imports it can type-check.
      - run: npm run build --workspace=packages/shared
      - run: npm run typecheck

  # ── API integration tests (need a real Postgres) ─────────────────────────────
  test-api:
    name: API tests
    runs-on: ubuntu-latest
    needs: typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: canvas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=packages/shared
      # Run migrations against the test database before vitest starts.
      - name: Migrate test DB
        run: node apps/api/scripts/migrate.js up
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/canvas_test
      - name: Run API tests
        run: npm run test --workspace=apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/canvas_test
          DB_NAME: canvas_test
          JWT_SECRET: ci-secret-32-chars-minimum-length
          # Config validation requires both at import; the tests mock the
          # actual Google token verification.
          GOOGLE_CLIENT_ID: ci-placeholder-client-id
          GOOGLE_CLIENT_SECRET: ci-placeholder-client-secret
          NODE_ENV: test
          STORAGE_DRIVER: local
          UPLOAD_DIR: /tmp/canvasly-uploads-ci

  # ── Web unit tests (jsdom, no server needed) ─────────────────────────────────
  test-web:
    name: Web tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=packages/shared
      - run: npm run test --workspace=apps/web

  # ── Docker build verification (no push — Railway deploys on merge to main) ───
  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [test-api, test-web]
    # Only run on the default branch to save CI minutes on PRs.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          push: false
          build-args: |
            VITE_API_URL=https://api.example.com/api
            VITE_WS_URL=wss://api.example.com/collab
            VITE_GOOGLE_CLIENT_ID=placeholder
          cache-from: type=gha
          cache-to: type=gha,mode=max
