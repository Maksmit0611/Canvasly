server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve pre-compressed assets when the browser accepts them.
    gzip_static on;

    # Cache hashed assets forever; index.html must always revalidate.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # All other routes fall through to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
